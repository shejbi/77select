<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resell Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="py-8 border-b border-slate-800 text-center glass-card sticky top-0 z-40">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
      RESELL CATALOG
    </h1>
    <p class="text-slate-400 mt-2 text-sm md:text-base">Exkluzívne kúsky za najlepšie ceny</p>
  </header>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    
    <!-- Filters / Controls -->
    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
      <input type="text" id="searchInput" placeholder="Hľadať produkt, značku..." class="w-full md:w-1/3 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 focus:outline-none focus:border-blue-500">
      
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="filterType('all')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white hover:bg-blue-500 transition">Všetko</button>
        <button onclick="filterType('new')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-700 text-slate-200 hover:bg-slate-600 transition">Nové</button>
        <button onclick="filterType('second-hand')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-700 text-slate-200 hover:bg-slate-600 transition">Second-Hand</button>
      </div>
    </div>

    <!-- Products Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Generuje JS -->
    </div>
  </main>

  <!-- Modal na detail produktu / fotky -->
  <div id="imageModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="relative max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden p-4 flex flex-col items-center">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold z-10">&times;</button>
      
      <div class="relative w-full flex items-center justify-center min-h-[300px] max-h-[70vh]">
        <img id="modalImage" src="" alt="Detail" class="max-h-[70vh] object-contain rounded-lg">
        <button id="prevBtn" onclick="changeImage(-1)" class="absolute left-2 bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full">&larr;</button>
        <button id="nextBtn" onclick="changeImage(1)" class="absolute right-2 bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full">&rarr;</button>
      </div>

      <div id="modalDetails" class="mt-4 text-center">
        <h3 id="modalTitle" class="text-xl font-bold text-white"></h3>
        <p id="modalPrice" class="text-emerald-400 font-semibold text-lg"></p>
        <p id="modalNote" class="text-slate-400 text-sm mt-1"></p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-6 text-center text-slate-500 text-sm border-t border-slate-800">
    &copy; Resell Catalog. Všetky práva vyhradené.
  </footer>

  <script>
    const products = [
      { id: 16, brand: "Louis Vuitton", name: "Damier Graphite Wallet", category: "Doplnky / Peňaženka", price: 35.00, type: "second-hand", size: "UNI", condition: "9/10", sold: false, note: "", images: ["louisvuittonpenazenka.jpg", "louisvuittonpenazenka.jpeg"] },
      { id: 13, brand: "Prada", name: "Black Crossbody Bag", category: "Doplnky / Taška", price: 25.00, type: "new", size: "UNI", condition: "10/10 (Nové)", sold: false, note: "", images: ["prada1.jpeg", "prada2.jpeg"] },
      { id: 14, brand: "Essentials", name: "Fear of God Sweat Shorts", category: "Teplákové kraťasy", price: 30.00, type: "second-hand", size: "M/L", condition: "9/10", sold: false, note: "Na fotkách pôsobia mierne do hneda v dôsledku fotoaparátu/osvetlenia.", images: ["essentials1.jpeg", "essentials2.jpeg", "essentials3.jpeg"] },
      { id: 15, brand: "Octagon", name: "Joker Make Terror Have Fun Hoodie", category: "Mikina s kapucňou", price: 45.00, type: "new", size: "M", condition: "10/10 (Nové)", sold: false, note: "", images: ["octagon1.jpeg", "octagon2.jpeg", "octagon3.jpeg"] },
      { id: 1, brand: "Nike x Supreme", name: "Air Force 1 Low Black", category: "Tenisky", price: 50.00, type: "second-hand", size: "EU 45.5", condition: "8/10", sold: false, note: "", images: ["airforce1.jpeg"] },
      { id: 2, brand: "DSQUARED2", name: "Distressed Jeans", category: "Rifle / Džínsy", price: 50.00, type: "new", size: "M", condition: "10/10 (Nové)", sold: false, note: "", images: ["dsquared1.jpeg"] },
      { id: 3, brand: "Nike", name: "Air Max 95 Triple Black", category: "Tenisky", price: 35.00, type: "second-hand", size: "EU 44", condition: "6/10", sold: false, note: "", images: ["airmax1.jpeg", "airmax2.jpeg"] },
      { id: 4, brand: "Supply & Demand", name: "Dark Grey Jeans", category: "Rifle / Džínsy", price: 25.00, type: "new", size: "M", condition: "10/10 (Nové)", sold: false, note: "", images: ["supplyrifle1.jpeg", "supplyrifle2.jpeg"] },
      { id: 5, brand: "Moncler", name: "Navy Blue Polo Shirt", category: "Polo tričko", price: 40.00, type: "second-hand", size: "S", condition: "9/10", sold: false, note: "", images: ["moncler1.jpeg", "moncler2.jpeg"] },
      { id: 6, brand: "Louis Vuitton", name: "Rainbow Hologram Belt", category: "Doplnky / Opasok", price: 30.00, type: "second-hand", size: "115 cm", condition: "9/10", sold: false, note: "", images: ["luis1.jpeg", "Luis1.jpeg"] },
      { id: 7, brand: "Gianni Kavanagh", name: "Distressed Patch Jeans", category: "Rifle / Džínsy", price: 40.00, type: "new", size: "S", condition: "10/10 (Nové)", sold: false, note: "", images: ["gianni1.jpeg", "gianni2.jpeg", "gianni3.jpeg"] },
      { id: 8, brand: "Ninetytwo", name: "Grey Sweat Shorts", category: "Teplákové kraťasy", price: 30.00, type: "second-hand", size: "M", condition: "9/10", sold: false, note: "", images: ["GreyShort1.jpeg"] },
      { id: 9, brand: "Nike / FC Barcelona", name: "Training Pants", category: "Tepláky", price: 30.00, type: "new", size: "S", condition: "10/10 (Nové)", sold: false, note: "", images: ["nike1.jpeg", "nike2.jpeg"] },
      { id: 10, brand: "Lacoste", name: "White Logo Hoodie", category: "Mikina s kapucňou", price: 30.00, type: "new", size: "M", condition: "10/10 (Nové)", sold: true, note: "", images: ["lacoste1.jpeg"] },
      { id: 11, brand: "Denim Tears", name: "Cotton Wreath Grey Hoodie", category: "Mikina s kapucňou", price: 40.00, type: "new", size: "M", condition: "10/10 (Nové)", sold: false, note: "", images: ["denim1.jpeg", "denim2.jpeg"] },
      { id: 12, brand: "Moncler", name: "Puffer Vest", category: "Vesta", price: 30.00, type: "second-hand", size: "M", condition: "5/10", sold: false, note: "", images: ["monclervesta1.jpeg"] }
    ];

    let currentTypeFilter = 'all';
    let currentModalImages = [];
    let currentImageIndex = 0;

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = products.filter(p => {
        const matchesSearch = p.brand.toLowerCase().includes(search) || p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search);
        const matchesType = currentTypeFilter === 'all' || p.type === currentTypeFilter;
        return matchesSearch && matchesType;
      });

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = `glass-card rounded-2xl overflow-hidden flex flex-col justify-between hover:border-slate-600 transition duration-300 ${p.sold ? 'opacity-60' : ''}`;
        
        const badgeColor = p.type === 'new' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        const badgeText = p.type === 'new' ? 'Nové' : 'Second-Hand';

        card.innerHTML = `
          <div>
            <div class="relative aspect-square overflow-hidden bg-slate-900 cursor-pointer" onclick="openModal(${p.id})">
              <img src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.onerror=null; if('${p.images[1]}') this.src='${p.images[1]}';">
              ${p.sold ? '<div class="absolute inset-0 bg-black/70 flex items-center justify-center"><span class="text-red-500 font-extrabold text-2xl tracking-widest border-4 border-red-500 px-4 py-2 rounded-lg transform -rotate-12">PREDANÉ</span></div>' : ''}
              <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeColor}">
                ${badgeText}
              </span>
            </div>
            <div class="p-5">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">${p.brand}</div>
              <h2 class="text-lg font-bold text-white mb-2 leading-tight">${p.name}</h2>
              
              <div class="space-y-1 text-sm text-slate-300 mb-4">
                <p><span class="text-slate-500">Kategória:</span> ${p.category}</p>
                <p><span class="text-slate-500">Veľkosť:</span> <span class="font-semibold text-white">${p.size}</span></p>
                <p><span class="text-slate-500">Stav:</span> ${p.condition}</p>
                ${p.note ? `<p class="text-xs text-amber-300/80 mt-2 bg-amber-500/10 p-2 rounded border border-amber-500/20">${p.note}</p>` : ''}
              </div>
            </div>
          </div>
          
          <div class="p-5 pt-0 flex items-center justify-between mt-auto">
            <span class="text-2xl font-extrabold text-emerald-400">${p.price.toFixed(2)} €</span>
            <button onclick="openModal(${p.id})" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-lg border border-slate-700 transition">
              Detail / Fotky
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterType(type) {
      currentTypeFilter = type;
      renderProducts();
    }

    document.getElementById('searchInput').addEventListener('input', renderProducts);

    function openModal(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      currentModalImages = product.images;
      currentImageIndex = 0;

      document.getElementById('modalTitle').innerText = `${product.brand} - ${product.name}`;
      document.getElementById('modalPrice').innerText = `${product.price.toFixed(2)} €`;
      document.getElementById('modalNote').innerText = product.note || '';

      updateModalImage();
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
    }

    function updateModalImage() {
      const img = document.getElementById('modalImage');
      img.src = currentModalImages[currentImageIndex];

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (currentModalImages.length <= 1) {
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
      }
    }

    function changeImage(direction) {
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentModalImages.length - 1;
      if (currentImageIndex >= currentModalImages.length) currentImageIndex = 0;
      updateModalImage();
    }

    // Inicializácia
    renderProducts();
  </script>
</body>
</html>
