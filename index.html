<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>77SELECT</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #0d0d0d; 
      color: #ffffff; 
      padding: 0; 
      margin: 0; 
    }
    
    header { 
      text-align: center; 
      padding: 50px 20px 30px; 
      background: #000000;
      border-bottom: 1px solid #222;
    }
    
    header h1 { 
      font-size: 4rem; 
      font-weight: 900; 
      letter-spacing: 2px; 
      margin: 0; 
      color: #fff; 
    }
    
    header p { 
      font-size: 1.1rem; 
      color: #888; 
      letter-spacing: 4px; 
      text-transform: uppercase; 
      margin-top: 10px; 
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 25px; 
    }
    
    .card { 
      background: #161616; 
      border: 1px solid #262626; 
      border-radius: 16px; 
      padding: 16px; 
      text-align: center; 
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #444;
    }

    .card img { 
      width: 100%; 
      height: 280px; 
      object-fit: cover; 
      border-radius: 10px; 
      margin-bottom: 15px; 
      background: #222;
    }

    .brand { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: #fff; 
      margin-bottom: 5px;
    }

    .category { 
      font-size: 0.85rem; 
      color: #aaa; 
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <h1>77</h1>
    <p>WEAR WHAT U SELECT</p>
  </header>

  <div class="container">
    <div class="grid" id="products"></div>
  </div>

  <script>
    const data = {
      "items": [
        { "brand": "Gianni Kavanagh", "category": "Rifle / Džínsy", "images": ["gianni1.jpeg", "gianni1.jpg"] },
        { "brand": "Ninetytwo", "category": "Teplákové kraťasy", "images": ["GreyShort1.jpeg", "GreyShort1.jpg", "greyshort1.jpeg"] },
        { "brand": "Lacoste", "category": "Mikina s kapucňou", "images": ["lacoste1.jpeg", "lacoste1.jpg"] },
        { "brand": "Louis Vuitton", "category": "Opasok", "images": ["Luis1.jpeg", "luis1.jpeg", "luis1.jpg"] },
        { "brand": "Moncler", "category": "Polo tričko", "images": ["moncler1.jpeg", "moncler1.jpg"] },
        { "brand": "Moncler", "category": "Vesta", "images": ["monclervesta1.jpeg", "monclervesta1.jpg"] },
        { "brand": "Nike / FC Barcelona", "category": "Tepláky", "images": ["nike1.jpeg", "nike1.jpg"] },
        { "brand": "Supply & Demand", "category": "Teplákové kraťasy", "images": ["supplykratase1.jpeg", "supplykratase1.jpg"] },
        { "brand": "Supply & Demand", "category": "Rifle / Džínsy", "images": ["supplyrifle1.jpeg", "supplyrifle1.jpg"] },
        { "brand": "Under Armour", "category": "Nátelník / Zips tričko", "images": ["underarmour1.jpeg", "underarmour1.jpg"] },
        { "brand": "Denim Tears", "category": "Mikina", "images": ["denim1.jpeg", "denim1.jpg"] },
        { "brand": "Nike x Supreme", "category": "Tenisky (Air Force 1 Low)", "images": ["airforce1.jpeg", "airforce1.jpg"] },
        { "brand": "Nike", "category": "Tenisky (Air Max 95)", "images": ["airmax1.jpeg", "airmax1.jpg"] }
      ]
    };

    const container = document.getElementById('products');
    data.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const img = document.createElement('img');
      let imgIndex = 0;
      img.src = item.images[imgIndex];
      img.alt = item.brand;
      
      img.onerror = function() {
        imgIndex++;
        if (imgIndex < item.images.length) {
          this.src = item.images[imgIndex];
        } else {
          this.src = 'https://via.placeholder.com/300x300/222/fff?text=Obrázok+nenájdený';
        }
      };

      card.appendChild(img);
      card.innerHTML += `
        <div class="brand">${item.brand}</div>
        <div class="category">${item.category}</div>
      `;
      container.appendChild(card);
    });
  </script>

</body>
</html>
